# Aktarıcı sunucu: genel posta portlarını Tailscale üzerinden mail CT'sine aktarır. TLS'yi Stalwart açar (TCP geçişi);
# send-proxy-v2 gönderenin gerçek IP'sini taşır, yoksa SPF ve spam denetimi aktarıcıyı görür.
# MAIL_HOST systemd ortamından gelir: /etc/systemd/system/haproxy.service.d/mail.conf
global
    log /dev/log local0
    user haproxy
    group haproxy
    daemon

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 10s
    # IMAP IDLE oturumu 30 dk'ya dek sessiz kalabilir
    timeout client 35m
    timeout server 35m

frontend smtp
    bind :25
    default_backend smtp
frontend smtps
    bind :465
    default_backend smtps
frontend submission
    bind :587
    default_backend submission
frontend imaps
    bind :993
    default_backend imaps

backend smtp
    server mail "${MAIL_HOST}":25 send-proxy-v2
backend smtps
    server mail "${MAIL_HOST}":465 send-proxy-v2
backend submission
    server mail "${MAIL_HOST}":587 send-proxy-v2
backend imaps
    server mail "${MAIL_HOST}":993 send-proxy-v2
