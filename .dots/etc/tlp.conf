# =========================================================
#  TLP for ThinkPad T14 Gen 5 (Intel Ultra 7 155U)
#  Optimized for CachyOS & Meteor Lake Architecture
# =========================================================

# --- Genel Etkinleştirme ---
TLP_ENABLE=1
TLP_DEFAULT_MODE=AC

# --- İşlemci (CPU) Ayarları ---
# intel_pstate'te iki durumda da powersave: performance governor EPP'yi yok sayar,
# frekansı EPP ile donanım (HWP) yönetir.
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave

# Enerji Performans Tercihi (EPP)
# Bataryada 'power' yerine 'balance_power' akıcılığı korur.
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power

# Turbo Boost kontrolü
# Prizde kapalıyken işlemci 1,7 GHz taban frekansında kalıyordu; pilde kapalı kalır.
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0

# --- Intel GPU (Intel Graphics) ---
# Frekans sınırı yok: donanım aralığı 800-1950 MHz, boştayken RC6 GPU'yu zaten uyutur.
# Pilde 800 MHz'e sabitlemek az kazandırıp video ve masaüstü akıcılığını düşürüyordu.

# --- Platform Profili (Lenovo ACPI) ---
# Fan ve güç limitlerini donanım seviyesinde ayarlar
PLATFORM_PROFILE_ON_AC=balanced
PLATFORM_PROFILE_ON_BAT=low-power

# --- Depolama (NVMe & Disk) ---
# NVMe APST'yi çekirdek kendisi açar; TLP'de bunun için ayar yok.
DISK_DEVICES="nvme0n1"

# --- Ağ (Wi-Fi & Bluetooth) ---
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# Açılışta Bluetooth'u kapalı tutar (Pil tasarrufu için)
DEVICES_TO_DISABLE_ON_STARTUP="bluetooth"

# --- PCI Express (ASPM) ---
# Güç tasarrufu için kritik PCIe hattı yönetimi; pilde Wi-Fi koparsa 'default' yapın
PCIE_ASPM_ON_AC=performance
PCIE_ASPM_ON_BAT=powersupersave

# --- Runtime Power Management ---
# on: aygıtlar hep açık, auto: boştaki PCI aygıtları askıya alınır
RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto
# RUNTIME_PM_DRIVER_DENYLIST verilmez: varsayılan liste (xhci_hcd dahil) USB-C dock ve fare sorunlarını önler

# --- USB Ayarları ---
USB_AUTOSUSPEND=1

# --- Ses Kartı ---
# Sesi cachyos-settings yönetir (/usr/lib/udev/rules.d/20-audio-pm.rules: prizde 0, pilde 10);
# TLP de yazınca pilde onun 1'inin üstüne 10 yazılıyordu. Boş değer TLP'nin varsayılanını (1) ezer,
# TLP sese hiç dokunmaz. Satırları silmek yetmez: o zaman varsayılan devreye girer.
SOUND_POWER_SAVE_ON_AC=""
SOUND_POWER_SAVE_ON_BAT=""
# Güç tasarrufu profili (`tlp power-saver`) için de varsayılan 1'i ez
SOUND_POWER_SAVE_ON_SAV=""

# --- Batarya Sağlığı (ThinkPad Özel) ---
# Sürekli prizde kullanım için ideal 70-80 bandı; yolculuk öncesi tek sefer: `sudo tlp fullcharge`
START_CHARGE_THRESH_BAT0=70
STOP_CHARGE_THRESH_BAT0=80
