# ip64 package

matches:
  - trigger: ":ip4"
    replace: "{{ipv4}}"
    vars:
      - name: ipv4
        type: shell
        params:
          cmd: "echo $(curl https://api.ipify.org)"

  - trigger: ":ip6"
    replace: "{{ipv6}}"
    vars:
      - name: ipv6
        type: shell
        params:
          cmd: "echo $(curl https://api64.ipify.org)"
